<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考場電子看板 - 西寧國小版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Roboto+Mono:wght@500;700&display=swap');

        /* --- 全域變數與配色 --- */
        :root {
            --bg-gradient-1: #e0eafc;
            --bg-gradient-2: #cfdef3;
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --accent-color: #0984e3;
            
            /* 狀態色 */
            --active-bg: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            --active-text: #fff;
            --active-shadow: 0 4px 15px rgba(253, 160, 133, 0.4);
            
            /* HP 血條顏色 */
            --hp-high: #00b894; 
            --hp-mid: #fdcb6e;
            --hp-low: #ff7675;
        }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 主容器 */
        .container {
            width: 96%;
            height: 94%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-light);
            display: grid;
            /* 修改這裡：左邊寬度調整為 40% */
            grid-template-columns: 40% 60%; 
            grid-template-rows: 25% 55% 20%;
            overflow: hidden;
        }

        /* --- 1. 左上：時鐘區 --- */
        .clock-section {
            background: rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        .clock-label { 
            font-size: 1.5rem;
            color: var(--text-secondary); 
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .clock-time { 
            font-size: 5rem; 
            font-weight: 700; 
            font-family: 'Roboto Mono', monospace; 
            color: var(--text-primary);
            letter-spacing: -2px;
            background: -webkit-linear-gradient(#2d3436, #636e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- 2. 右側：主訊息區 --- */
        .message-section {
            grid-column: 2 / 3;
            grid-row: 1 / 4;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.8);
        }

        /* Boss Battle Area */
        .boss-battle-area {
            background: white;
            margin: 30px;
            padding: 25px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 30px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .boss-avatar {
            font-size: 4.5rem;
            min-width: 90px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
            transform-origin: center bottom;
        }
        
        /* === Boss Avatar Animations === */
        @keyframes float-breath {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .anim-float { animation: float-breath 3s ease-in-out infinite; }

        @keyframes nervous-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .anim-shake { animation: nervous-shake 0.8s infinite; }

        @keyframes violent-shake {
            0% { transform: translate(0, 0) scale(1.2); }
            25% { transform: translate(-5px, 5px) scale(1.2); }
            50% { transform: translate(5px, -5px) scale(1.2); }
            75% { transform: translate(-5px, -5px) scale(1.2); }
            100% { transform: translate(0, 0) scale(1.2); }
        }
        .anim-angry { animation: violent-shake 0.1s infinite; filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.6)) !important; }

        @keyframes sad-bounce {
            0%, 100% { transform: scale(1, 1) translateY(0); }
            10% { transform: scale(1.1, 0.9) translateY(0); }
            30% { transform: scale(0.9, 1.1) translateY(-20px); }
            50% { transform: scale(1, 1) translateY(0); }
            57% { transform: scale(1, 1) translateY(-7px); }
            64% { transform: scale(1, 1) translateY(0); }
            100% { transform: scale(1, 1) translateY(0); }
        }
        .anim-cry { animation: sad-bounce 1.5s infinite; }

        /* === 擊敗與勝利動畫 === */
        @keyframes defeat-spin {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.3) rotate(-15deg); }
            50% { transform: scale(0.9) rotate(20deg) translateY(8px); }
            75% { transform: scale(1.15) rotate(-10deg) translateY(12px); }
            100% { transform: scale(1) rotate(0deg) translateY(5px); }
        }
        .anim-defeat {
            animation: defeat-spin 1.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)) !important;
        }

        /* 彩帶 Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }

        .boss-avatar:active {
            transform: scale(0.8) !important;
            animation: none !important;
        }

        .hp-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hp-text {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-weight: 900;
            color: var(--text-primary);
        }
        .hp-text .boss-name { font-size: 2rem; }
        .hp-text .boss-timer { font-size: 1.8rem; font-family: 'Roboto Mono', monospace; color: var(--text-secondary); }

        /* 進度條外框 - 修改為 visible 讓恐龍可以凸出來 */
        .hp-bar-frame {
            height: 40px;
            background-color: #dfe6e9;
            border-radius: 20px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: visible; /* 關鍵：讓恐龍不被切掉 */
            margin-top: 20px; /* 增加上方空間給恐龍 */
        }

        /* 進度條填充 - 加入圓角 */
        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: var(--hp-high);
            border-radius: 20px;
            transition: width 0.5s linear, background 0.5s;
            position: relative;
            
            /* 條紋背景 */
            background-image: linear-gradient(
                45deg, 
                rgba(255, 255, 255, 0.2) 25%, 
                transparent 25%, 
                transparent 50%, 
                rgba(255, 255, 255, 0.2) 50%, 
                rgba(255, 255, 255, 0.2) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 40px 40px;
            animation: stripe-move 2s linear infinite;
        }

        /* 恐龍跑者 */
        .dino-runner {
            position: absolute;
            right: -25px; /* 調整位置在進度條末端 */
            top: -45px;   /* 站在進度條上方 */
            font-size: 3rem;
            /* 恐龍預設面左，不需要翻轉 */
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            animation: dino-walk 0.6s ease-in-out infinite alternate;
            z-index: 5;
            pointer-events: none; /* 不干擾點擊 */
        }

        @keyframes dino-walk {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-5px) rotate(-5deg); }
        }

        @keyframes stripe-move {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        /* 提醒大字 (支援跑馬燈) */
        .reminder-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            padding: 30px;
            color: var(--text-primary);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            overflow: hidden; 
            position: relative;
        }

        #main-reminder {
            width: 100%;
            white-space: pre-wrap;
            line-height: 1.3;
        }

        .reminder-area.marquee-active #main-reminder {
            width: auto;
            white-space: nowrap;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            animation: reminder-scroll 20s linear infinite;
            padding-left: 100%;
            display: inline-block;
        }

        @keyframes reminder-scroll {
            from { transform: translate(0, -50%); }
            to { transform: translate(-100%, -50%); left: 0; } 
        }

        /* --- 3. 左中：課表區 --- */
        .schedule-section {
            grid-row: 2 / 3;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            border-right: 1px solid rgba(0,0,0,0.05);
            overflow-y: auto;
        }

        .schedule-row {
            flex: 1;
            background: white;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 35px;
            color: var(--text-secondary);
            font-size: 2rem;
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
        }

        .schedule-row .subject-time {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.8rem;
            opacity: 0.8;
        }

        /* 當前科目的樣式 */
        .schedule-row.active {
            background: var(--active-bg);
            color: var(--active-text);
            box-shadow: var(--active-shadow);
            transform: scale(1.02);
            border: none;
            z-index: 10;
        }
        .schedule-row.active .subject-time { opacity: 1; }

        /* 已考完的樣式 */
        .schedule-row.finished {
            background-color: #f7f9fa; /* 變灰白 */
            opacity: 0.7; /* 稍微變淡 */
            box-shadow: none;
        }
        .schedule-row.finished .subject-name {
            color: #95a5a6; /* 文字變灰 */
        }
        .schedule-row.finished .status-icon {
            color: #00b894; /* 綠色勾勾 */
            font-size: 2.2rem;
            text-shadow: 0 2px 5px rgba(0,184,148,0.4);
        }

        /* 預設圖示區塊 */
        .subject-container {
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden; /* 防止溢出 */
        }
        .subject-name {
            white-space: nowrap; /* 確保不換行 */
        }
        .status-icon {
            width: 35px; /* 固定寬度避免文字跳動 */
            display: inline-block;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0; /* 確保圖示不被壓縮 */
        }

        /* --- 4. 左下：考勤統計區 --- */
        .attendance-section {
            grid-row: 3 / 4;
            background: #fff;
            border-right: 1px solid rgba(0,0,0,0.05);
            border-top: 1px solid rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #f1f2f6;
            transition: background 0.3s;
        }
        .stat-box:hover { background: #fdfdfd; }

        .stat-label { 
            font-size: 1.1rem; 
            color: #b2bec3; 
            margin-bottom: 5px; 
            font-weight: 700; 
            letter-spacing: 1px;
        }
        .stat-value { font-size: 3rem; font-weight: 900; color: var(--text-primary); line-height: 1;}
        .stat-value.expected { color: #0984e3; }
        .stat-value.actual { color: #00b894; }

        .stat-box.list-box {
            align-items: flex-start;
            padding: 20px 25px;
            overflow: hidden;
            border-right: none;
            background: #fdfdfd;
        }
        
        .absent-list { 
            font-size: 1.3rem; 
            color: #636e72; 
            font-weight: 700; 
            width: 100%;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        /* --- 設定面板 --- */
        #settings-panel {
            display: none;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 40px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border-radius: 20px; z-index: 2000; width: 550px;
            max-height: 90vh; overflow-y: auto;
            border: 1px solid white;
        }
        
        #settings-panel h2 { margin-top: 0; color: var(--text-primary); border-bottom: 2px solid #f1f2f6; padding-bottom: 15px; font-size: 1.8rem;}
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-primary); font-size: 1.1rem;}
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 12px 15px; font-size: 1rem; box-sizing: border-box; 
            border: 2px solid #dfe6e9; border-radius: 10px; outline: none; transition: 0.3s;
            background: #fcfcfc; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { 
            border-color: var(--accent-color); 
            background: #fff;
            box-shadow: 0 0 0 4px rgba(9, 132, 227, 0.1);
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 20px; height: 20px; margin: 0;
            accent-color: var(--accent-color);
        }
        .checkbox-wrapper label { margin: 0; cursor: pointer; display: inline-block; }

        .btn-group { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .btn { 
            padding: 12px 30px; 
            background: var(--accent-color); 
            color: white; border: none; border-radius: 10px; 
            cursor: pointer; font-size: 1.1rem; font-weight: 700; 
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(9, 132, 227, 0.4); }
        .btn-close { background: #b2bec3; box-shadow: none; color: #2d3436;}
        .btn-close:hover { background: #dfe6e9; color: #000;}
        
        #config-btn { 
            position: fixed; bottom: 20px; right: 20px; 
            width: 50px; height: 50px; border-radius: 50%;
            background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer; font-size: 24px; border: none; 
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
            opacity: 0.5;
            z-index: 1000;
        }
        #config-btn:hover { opacity: 1; transform: rotate(90deg) scale(1.1); }

        #fullscreen-btn { 
            position: fixed; bottom: 80px; right: 20px; 
            width: 50px; height: 50px; border-radius: 50%;
            background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer; font-size: 22px; border: none; 
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
            opacity: 0.5;
            z-index: 1000;
        }
        #fullscreen-btn:hover { opacity: 1; transform: scale(1.1); }

        /* 最後 5 分鐘緊張微光呼吸動畫 */
        @keyframes urgent-pulse {
            0%, 100% {
                box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 0 0 rgba(255, 118, 117, 0);
            }
            50% {
                box-shadow: 0 10px 30px rgba(255, 118, 117, 0.35), 0 0 25px rgba(255, 118, 117, 0.55);
            }
        }
        .boss-battle-area.urgent-mode {
            animation: urgent-pulse 1.8s infinite ease-in-out;
            border-color: rgba(255, 118, 117, 0.6) !important;
        }
        
        .settings-highlight { background: #e3f2fd; padding: 20px; border-radius: 12px; border: 1px solid #bbdefb; margin-bottom: 25px;}

    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 時鐘區 -->
        <div class="clock-section">
            <div class="clock-label">臺中市清水區西寧國小</div>
            <div class="clock-time" id="clock">00:00:00</div>
        </div>

        <!-- 2. 主訊息區 -->
        <div class="message-section">
            <!-- Boss 血條 -->
            <div class="boss-battle-area">
                <div class="boss-avatar anim-float" id="boss-icon" onclick="bossClickReaction()">☕</div>
                <div class="hp-container">
                    <div class="hp-text">
                        <span class="boss-name" id="boss-name">休息中</span>
                        <span class="boss-timer" id="boss-timer">--:--</span>
                    </div>
                    <div class="hp-bar-frame">
                        <div class="hp-bar-fill" id="hp-bar" style="width: 100%; background: #ccc;">
                            <!-- 恐龍跑者：放在填充條內部，透過 CSS 定位在末端 -->
                            <div class="dino-runner" id="dino-icon">🦖</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 提醒大字 -->
            <div class="reminder-area" id="reminder-container">
                <div id="main-reminder">
                    準備考試<br>請保持安靜
                </div>
            </div>
        </div>

        <!-- 3. 課表區 -->
        <div class="schedule-section" id="schedule-list">
            <!-- JS 自動產生 -->
        </div>

        <!-- 4. 考勤統計區 -->
        <div class="attendance-section">
            <div class="stat-box">
                <div class="stat-label">應到</div>
                <div class="stat-value expected" id="display-expected">30</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">實到</div>
                <div class="stat-value actual" id="display-actual">28</div>
            </div>
            <div class="stat-box list-box">
                <div class="absent-list" id="display-absent-list">
                    缺考座號:原因
                </div>
            </div>
        </div>
    </div>

    <!-- 懸浮控制按鈕 -->
    <button id="fullscreen-btn" onclick="toggleFullscreen()" title="切換全螢幕 (快捷鍵 F)">🖥️</button>
    <button id="config-btn" onclick="openSettings()" title="看板設定">⚙️</button>

    <!-- 設定面板 -->
    <div id="settings-panel">
        <h2>🔧 看板設定</h2>
        
        <div class="form-group settings-highlight">
            <label>📅 選擇考程 (自動載入)</label>
            <div style="display: flex; gap: 15px;">
                <select id="select-grade">
                    <option value="high">高年級 (5-6年級)</option>
                    <option value="middle">中年級 (3-4年級)</option>
                    <option value="low">低年級 (1-2年級)</option>
                </select>
                <select id="select-day">
                    <option value="day1">第一天</option>
                    <option value="day2">第二天</option>
                </select>
            </div>
        </div>

        <div class="form-group settings-highlight" style="background: #eef2ff; border-color: #c7d2fe;">
            <label>🎮 角色造型自訂</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 8px;">
                <div>
                    <label style="font-size: 0.95rem; margin-bottom: 4px; color: var(--text-secondary); font-weight: 700;">👹 BOSS 造型</label>
                    <select id="select-boss">
                        <option value="monster">👾 外星怪獸</option>
                        <option value="dragon">🐲 遠古巨龍</option>
                        <option value="robot">🤖 戰鬥機器人</option>
                        <option value="demon">😈 考試大魔王</option>
                        <option value="ghost">👻 搗蛋幽靈</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.95rem; margin-bottom: 4px; color: var(--text-secondary); font-weight: 700;">🏃 跑者造型</label>
                    <select id="select-runner">
                        <option value="dino">🦖 奔跑暴龍</option>
                        <option value="rocket">🚀 極速火箭</option>
                        <option value="cat">🐱 疾走小貓</option>
                        <option value="skater">🛹 滑板少年</option>

    <script>
        // --- 角色庫：BOSS 與 跑者 ---
        const bossCharacters = {

                defeat: "💤"
            },
            robot: {

                normal: "🤖",

                angry: "💥",

        let currentBossKey = 'monster';
        let currentRunnerKey = 'dino';

        // --- 輕量彩帶 (Confetti) 粒子引擎 ---
        let confettiActive = false;
        let confettiParticles = [];
        const confettiColors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#fdcb6e'];

        function triggerConfetti(durationMs = 7000) {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';

            confettiParticles = [];
            for (let i = 0; i < 160; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * -canvas.height * 0.8,
                    w: Math.random() * 14 + 6,
                    h: Math.random() * 8 + 4,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    vy: Math.random() * 4 + 2.5,
                    vx: Math.random() * 4 - 2,
                    angle: Math.random() * 360,
                    angSpeed: (Math.random() - 0.5) * 10
                });
            }

            confettiActive = true;
            const startTime = Date.now();

            function renderConfetti() {
                if (!confettiActive) return;
                const elapsed = Date.now() - startTime;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                confettiParticles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx + Math.sin(p.y * 0.02) * 1.5;
                    p.angle += p.angSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();

                    if (p.y > canvas.height) {
                        p.y = -15;
                        p.x = Math.random() * canvas.width;
                    }
                });

                if (elapsed < durationMs) {
                    requestAnimationFrame(renderConfetti);
                } else {
                    confettiActive = false;
                    canvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(renderConfetti);
        }

        let victoryEndTime = 0;
        let lastExamState = { wasExamining: false, subjectName: "" };
        let victorySubjectName = "";

        function triggerVictory(subjectName) {
            victorySubjectName = subjectName || "考試";
            victoryEndTime = Date.now() + 10000; // 慶祝持續 10 秒

            triggerConfetti(7000);

            const bossCfg = bossCharacters[currentBossKey] || bossCharacters.monster;
            const bossIcon = document.getElementById('boss-icon');
            const bossName = document.getElementById('boss-name');
            const bossTimer = document.getElementById('boss-timer');
            const hpBar = document.getElementById('hp-bar');
            const mainReminder = document.getElementById('main-reminder');

            bossIcon.innerText = bossCfg.defeat;
            bossIcon.className = "boss-avatar anim-defeat";
            bossName.innerText = `⚔️【${victorySubjectName}】討伐成功！`;
            bossTimer.innerText = "K.O. ✨";
            hpBar.style.width = "0%";
            hpBar.style.background = "#00b894";
            document.getElementById('dino-icon').style.display = 'none';

            if (mainReminder) {
                mainReminder.innerText = `🎉 恭喜大家！\n【${victorySubjectName}】BOSS 討伐成功！進入下課休息`;
            }
        }

        function triggerVictoryPreview() {
            closeSettings();
            triggerVictory("模擬科目");
        }

        // --- 實務功能：全螢幕模式與快捷鍵 ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn("全螢幕請求被阻止：", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-btn');
            if (btn) {
                btn.innerText = document.fullscreenElement ? '🗗' : '🖥️';
                btn.title = document.fullscreenElement ? '退出全螢幕 (快捷鍵 F / Esc)' : '切換全螢幕 (快捷鍵 F)';
            }
        });

        document.addEventListener('keydown', (e) => {
            const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'textarea' || tag === 'select') {
                return;
            }
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

        // --- 實務功能：考勤人數智慧自動連動計算 ---
        function parseAbsentCount(text) {
            if (!text) return 0;
            const trimmed = text.trim();
            if (!trimmed || trimmed === '無' || trimmed === '缺考座號:原因' || trimmed === '全勤' || trimmed === '全到') {
                return 0;
            }
            // 依換行、逗號、分號、頓號分割各項紀錄
            const items = trimmed.split(/[\n,;，；、]+/).map(s => s.trim()).filter(s => s.length > 0);
            const validItems = items.filter(item => {
                return item !== '無' && item !== '缺考座號:原因' && item !== '全勤' && item !== '全到';
            });
            return validItems.length;
        }

        function autoCalculateAttendance() {
            const expectedInput = document.getElementById('input-expected');
            const actualInput = document.getElementById('input-actual');
            const absentInput = document.getElementById('input-absent-list');
            const hint = document.getElementById('absent-calc-hint');

            const expected = parseInt(expectedInput.value, 10);
            if (isNaN(expected)) return;

            const absentCount = parseAbsentCount(absentInput.value);
            const calculatedActual = Math.max(0, expected - absentCount);
            actualInput.value = calculatedActual;

            if (hint) {
                if (absentCount > 0) {
                    hint.innerText = `💡 偵測到缺考 ${absentCount} 人，已自動扣減並更新實到為 ${calculatedActual} 人`;
                    hint.style.color = '#0984e3';
                } else {
                    hint.innerText = `💡 目前無人缺考，實到人數自動等於應到 (${expected} 人)`;
                    hint.style.color = '#00b894';
                }
            }
        }

        // --- 資料庫：考程表 ---
        const allSchedules = {
            "high": { 
                "day1": [
                    { subject: "國語", start: "08:40", end: "09:20" },
                    { subject: "自然", start: "09:30", end: "10:10" },
                    { subject: "英語", start: "10:30", end: "11:10" }
                ],
                "day2": [
                    { subject: "數學", start: "08:40", end: "09:20" },
                    { subject: "社會", start: "09:30", end: "10:10" }
                ]
            },
            "middle": { 
                "day1": [
                    { subject: "國語", start: "08:40", end: "09:20" },
                    { subject: "自然", start: "09:30", end: "10:10" },
                    { subject: "英語", start: "10:30", end: "11:10" }
                ],
                "day2": [
                    { subject: "數學", start: "08:40", end: "09:20" },
                    { subject: "社會", start: "09:30", end: "10:10" }
                ]
            },
            "low": { 
                "day1": [
                    { subject: "國語", start: "08:40", end: "09:20" },
                    { subject: "生活", start: "09:30", end: "10:10" }
                ],
                "day2": [
                    { subject: "數學", start: "08:40", end: "09:20" }
                ]
            }
        };

        let currentSchedule = []; 

        // --- 核心邏輯 ---
        
        let clickCount = 0;
        let lastClickTime = 0;
        let reactionEndTime = 0;

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            updateScheduleAndBoss(now);
        }

        function bossClickReaction() {
            const now = Date.now();
            if (now - lastClickTime > 2000) {
                clickCount = 0;
            }
            lastClickTime = now;
            clickCount++;

            if (clickCount >= 10) {
                reactionEndTime = now + 5000;
                clickCount = 0;
                updateTime();
            }
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-list');
            container.innerHTML = ''; 
            
            if (currentSchedule.length === 0) {
                container.innerHTML = '<div style="margin:auto; text-align:center; color:#b2bec3; font-size: 1.5rem; font-weight:bold;">✨ 今日無考試行程</div>';
                return;
            }

            currentSchedule.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'schedule-row';
                row.id = `schedule-${index}`;
                // 修改 HTML 結構，加入狀態圖示欄位
                row.innerHTML = `
                    <div class="subject-container">
                        <span class="status-icon"></span>
                        <div class="subject-name">${item.subject}</div>
                    </div>
                    <div class="subject-time">${item.start}~${item.end}</div>
                `;
                container.appendChild(row);
            });
        }

        function updateScheduleAndBoss(nowDate) {
            const currentTotalMin = nowDate.getHours() * 60 + nowDate.getMinutes();
            
            let isExamining = false;
            let activeSubject = null;

            currentSchedule.forEach((item, index) => {
                const row = document.getElementById(`schedule-${index}`);
                if(!row) return;
                
                const iconSpan = row.querySelector('.status-icon');

                // 重置所有狀態
                row.classList.remove('active');
                row.classList.remove('finished');
                iconSpan.innerText = '';

                const [sH, sM] = item.start.split(':').map(Number);
                const [eH, eM] = item.end.split(':').map(Number);
                const startMin = sH * 60 + sM;
                const endMin = eH * 60 + eM;

                // 判斷邏輯
                if (currentTotalMin >= endMin) {
                    // 已考完
                    row.classList.add('finished');
                    iconSpan.innerText = '✔';
                } else if (currentTotalMin >= startMin && currentTotalMin < endMin) {
                    // 考試中
                    isExamining = true;
                    activeSubject = item;
                    row.classList.add('active');
                    
                    // Boss 血條計算
                    const startTime = new Date(nowDate); startTime.setHours(sH, sM, 0);
                    const endTime = new Date(nowDate); endTime.setHours(eH, eM, 0);
                    
                    const totalDuration = (endTime - startTime) / 1000;
                    const elapsed = (nowDate - startTime) / 1000;
                    const remaining = totalDuration - elapsed;

                    let percentage = ((remaining / totalDuration) * 100).toFixed(1);
                    if (percentage < 0) percentage = 0;

                    // 最後 5 分鐘警示處理
                    const alert5MinEnabled = localStorage.getItem('exam_board_alert_5min') !== 'false';
                    const bossBattleArea = document.querySelector('.boss-battle-area');
                    const reminderContainer = document.getElementById('reminder-container');
                    const mainReminder = document.getElementById('main-reminder');
                    const marqueeEnabled = localStorage.getItem('exam_board_marquee') === 'true';

                    if (alert5MinEnabled && remaining <= 300 && remaining > 0) {
                        if (bossBattleArea) bossBattleArea.classList.add('urgent-mode');
                        if (!marqueeEnabled && mainReminder && !mainReminder.innerText.includes('最後 5 分鐘')) {
                            mainReminder.innerText = "⚠️ 距離考試結束僅剩最後 5 分鐘！\n請仔細檢查劃卡、座號與姓名";
                        }
                    } else {
                        if (bossBattleArea) bossBattleArea.classList.remove('urgent-mode');
                        if (!marqueeEnabled && mainReminder && mainReminder.innerText.includes('最後 5 分鐘')) {
                            const savedReminder = localStorage.getItem('exam_board_reminder') || "準備考試\n請保持安靜";
                            mainReminder.innerText = savedReminder;
                        }
                    }

                    updateBossUI(item.subject, percentage, remaining);
                } else {
                    // 未開始 (預設狀態，不做額外處理)
                }
            });

            // 檢查是否剛好從考試中轉變為考完（觸發勝利通關慶祝）
            if (lastExamState.wasExamining && !isExamining) {
                triggerVictory(lastExamState.subjectName);
            }
            lastExamState.wasExamining = isExamining;
            if (isExamining && activeSubject) {
                lastExamState.subjectName = activeSubject.subject;
            }

            if (!isExamining) {
                const bossBattleArea = document.querySelector('.boss-battle-area');
                if (bossBattleArea) bossBattleArea.classList.remove('urgent-mode');

                // 如果目前在通關慶祝中，維持勝利畫面
                if (Date.now() < victoryEndTime) {
                    return;
                }

                // 恢復原設定之提醒文字
                const reminderContainer = document.getElementById('reminder-container');
                const mainReminder = document.getElementById('main-reminder');
                const savedReminder = localStorage.getItem('exam_board_reminder') || "準備考試\n請保持安靜";
                const marqueeEnabled = localStorage.getItem('exam_board_marquee') === 'true';
                if (!reminderContainer.classList.contains('marquee-active') && !marqueeEnabled) {
                    if (mainReminder && (mainReminder.innerText.includes('討伐成功') || mainReminder.innerText.includes('最後 5 分鐘'))) {
                        mainReminder.innerText = savedReminder;
                    }
                }

                document.getElementById('boss-icon').innerText = "☕"; 
                document.getElementById('boss-icon').className = "boss-avatar anim-float";
                document.getElementById('boss-name').innerText = "休息時間 / 準備下一科";
                document.getElementById('boss-timer').innerText = "";
                const bar = document.getElementById('hp-bar');
                bar.style.width = "100%";
                bar.style.background = "#b2bec3"; 
                
                // 休息時間隱藏跑者
                document.getElementById('dino-icon').style.display = 'none';
            } else {
                // 考試時間顯示跑者，並套用目前所選的造型
                const dinoIcon = document.getElementById('dino-icon');
                dinoIcon.innerText = runnerCharacters[currentRunnerKey] || "🦖";
                dinoIcon.style.display = 'block';
            }
        }

        function updateBossUI(subjectName, percentage, remainingSeconds) {
            const bossIcon = document.getElementById('boss-icon');
            const bossName = document.getElementById('boss-name');
            const bossTimer = document.getElementById('boss-timer');
            const hpBar = document.getElementById('hp-bar');

            const bossCfg = bossCharacters[currentBossKey] || bossCharacters.monster;

            // 預設圖示與狀態 class
            let iconText = bossCfg.normal;
            let animClass = "anim-float"; 
            let colorVar = "";

            bossName.innerText = `BOSS：${subjectName}`;
            
            const remMin = Math.floor(remainingSeconds / 60);
            const remSec = Math.floor(remainingSeconds % 60);
            const displaySec = String(remSec).padStart(2, '0');
            bossTimer.innerText = `剩餘 HP：${remMin}:${displaySec}`;

            hpBar.style.width = `${percentage}%`;

            if (percentage > 50) {
                colorVar = "var(--hp-high)"; 
                animClass = "anim-float"; 
            } else if (percentage > 20) {
                colorVar = "var(--hp-mid)";
                animClass = "anim-float"; 
            } else {
                colorVar = "var(--hp-low)";
                iconText = bossCfg.nervous; 
                animClass = "anim-shake"; 
            }

            // --- 彩蛋邏輯介入 ---
            if (Date.now() < reactionEndTime) {
                if (iconText === bossCfg.normal) {
                    iconText = bossCfg.angry; 
                    animClass = "anim-angry"; 
                } else if (iconText === bossCfg.nervous) {
                    iconText = bossCfg.cry; 
                    animClass = "anim-cry"; 
                }
            }
            
            bossIcon.innerText = iconText;
            bossIcon.className = `boss-avatar ${animClass}`;
            hpBar.style.background = colorVar;
        }

        // --- 設定面板功能 ---
        
        function openSettings() { document.getElementById('settings-panel').style.display = 'block'; }
        function closeSettings() { document.getElementById('settings-panel').style.display = 'none'; }

        function saveSettings() {
            const reminderText = document.getElementById('input-reminder').value;
            const marqueeEnabled = document.getElementById('input-reminder-marquee').checked;
            
            const expected = document.getElementById('input-expected').value;
            const actual = document.getElementById('input-actual').value;
            const absentList = document.getElementById('input-absent-list').value;

            const reminderContainer = document.getElementById('reminder-container');
            const mainReminder = document.getElementById('main-reminder');

            if (marqueeEnabled) {
                reminderContainer.classList.add('marquee-active');
                mainReminder.innerText = reminderText.replace(/\n/g, '   ');
            } else {
                reminderContainer.classList.remove('marquee-active');
                mainReminder.innerText = reminderText; 
            }

            document.getElementById('display-expected').innerText = expected;
            document.getElementById('display-actual').innerText = actual;
            document.getElementById('display-absent-list').innerText = absentList;

            const selectedGrade = document.getElementById('select-grade').value;
            const selectedDay = document.getElementById('select-day').value;
            currentSchedule = allSchedules[selectedGrade][selectedDay];
            renderSchedule();

            const selectedBoss = document.getElementById('select-boss').value;
            const selectedRunner = document.getElementById('select-runner').value;
            currentBossKey = selectedBoss;
            currentRunnerKey = selectedRunner;
            localStorage.setItem('exam_board_boss', selectedBoss);
            localStorage.setItem('exam_board_runner', selectedRunner);
            
            const dinoIcon = document.getElementById('dino-icon');
            if (dinoIcon) {
                dinoIcon.innerText = runnerCharacters[currentRunnerKey] || "🦖";
            }

            const alert5Min = document.getElementById('input-alert-5min').checked;
            localStorage.setItem('exam_board_alert_5min', alert5Min);

            localStorage.setItem('exam_board_grade', selectedGrade);
            localStorage.setItem('exam_board_day', selectedDay);
            localStorage.setItem('exam_board_reminder', reminderText);
            localStorage.setItem('exam_board_marquee', marqueeEnabled);
            localStorage.setItem('exam_board_expected', expected);
            localStorage.setItem('exam_board_actual', actual);
            localStorage.setItem('exam_board_absent_list', absentList);

            closeSettings();
        }

        function loadSavedSettings() {
            const savedGrade = localStorage.getItem('exam_board_grade') || 'high';
            const savedDay = localStorage.getItem('exam_board_day') || 'day1';
            
            document.getElementById('select-grade').value = savedGrade;
            document.getElementById('select-day').value = savedDay;
            currentSchedule = allSchedules[savedGrade][savedDay];

            currentBossKey = localStorage.getItem('exam_board_boss') || 'monster';
            currentRunnerKey = localStorage.getItem('exam_board_runner') || 'dino';
            document.getElementById('select-boss').value = currentBossKey;
            document.getElementById('select-runner').value = currentRunnerKey;
            const dinoIcon = document.getElementById('dino-icon');
            if (dinoIcon) {
                dinoIcon.innerText = runnerCharacters[currentRunnerKey] || "🦖";
            }

            const alert5Min = localStorage.getItem('exam_board_alert_5min') !== 'false';
            document.getElementById('input-alert-5min').checked = alert5Min;
            
            const items = ['reminder', 'expected', 'actual', 'absent_list'];
            const defaults = {
                reminder: "準備考試\n請保持安靜",
                expected: "30",
                actual: "28",
                absent_list: "缺考座號:原因"
            };
            const ids = {
                reminder: ['input-reminder', 'main-reminder'],
                expected: ['input-expected', 'display-expected'],
                actual: ['input-actual', 'display-actual'],
                absent_list: ['input-absent-list', 'display-absent-list']
            };

            items.forEach(key => {
                const savedVal = localStorage.getItem(`exam_board_${key}`);
                const val = savedVal !== null ? savedVal : defaults[key];
                document.getElementById(ids[key][0]).value = val;
                document.getElementById(ids[key][1]).innerText = val;
            });

            autoCalculateAttendance();

            const marqueeEnabled = localStorage.getItem('exam_board_marquee') === 'true';
            document.getElementById('input-reminder-marquee').checked = marqueeEnabled;
            
            const reminderText = document.getElementById('input-reminder').value;
            const reminderContainer = document.getElementById('reminder-container');
            const mainReminder = document.getElementById('main-reminder');
            
            if (marqueeEnabled) {
                reminderContainer.classList.add('marquee-active');
                mainReminder.innerText = reminderText.replace(/\n/g, '   ');
            } else {
                reminderContainer.classList.remove('marquee-active');
                mainReminder.innerText = reminderText;
            }
        }

        window.onload = function() {
            loadSavedSettings(); 
            renderSchedule(); 
            setInterval(updateTime, 1000);
            updateTime();
        };

    </script>

    <!-- 慶祝彩帶畫布 -->
    <canvas id="confetti-canvas"></canvas>
</body>
</html>
