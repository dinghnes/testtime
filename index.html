<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考場電子看板 - 西寧國小版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Roboto+Mono:wght@500;700&display=swap');

        /* --- 全域變數與配色 --- */
        :root {
            --bg-gradient-1: #e0eafc;
            --bg-gradient-2: #cfdef3;
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --accent-color: #0984e3;
            
            /* 狀態色 */
            --active-bg: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            --active-text: #fff;
            --active-shadow: 0 4px 15px rgba(253, 160, 133, 0.4);
            
            /* HP 血條顏色 */
            --hp-high: #00b894; 
            --hp-mid: #fdcb6e;
            --hp-low: #ff7675;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 主容器 (縱向 flex：上方主內容 + 底部提醒欄) */
        .container {
            width: calc(100vw - 36px);
            height: calc(100vh - 28px);
            max-width: 1800px;
            box-sizing: border-box;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 主內容區：左側 44% (時鐘+課表)，右側 56% (Boss+平行考勤)，minmax 防擠壓 */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 44%) minmax(0, 56%);
            min-height: 0;
            overflow: hidden;
        }

        /* 左側主面板 (時鐘 + 課表) */
        .left-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid rgba(0,0,0,0.06);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.25);
            min-width: 0;
        }

        /* --- 1. 左上：時鐘區 --- */
        .clock-section {
            flex: 0 0 130px;
            background: rgba(255, 255, 255, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 6px 0;
            flex-shrink: 0;
        }

        .clock-label { 
            font-size: 1.35rem;
            color: var(--text-secondary); 
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        
        .clock-time { 
            font-size: 4.6rem; 
            font-weight: 700; 
            font-family: 'Roboto Mono', monospace; 
            color: var(--text-primary);
            letter-spacing: -2px;
            background: -webkit-linear-gradient(#2d3436, #636e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        /* --- 2. 左側：課表區 (考試焦點 / 下課全日清單) --- */
        .schedule-section {
            flex: 1;
            min-height: 0;
            background: rgba(255, 255, 255, 0.2);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px; 
            overflow-x: hidden;
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            min-width: 0;
        }

        .schedule-row {
            flex: 1;
            min-height: 54px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            color: var(--text-secondary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
        }

        .schedule-badge-area {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            min-width: 0;
        }

        .schedule-row .subject-name {
            font-size: 1.6rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .schedule-row .subject-time {
            margin-left: auto;
            font-family: 'Roboto Mono', monospace;
            font-size: 1.35rem;
            opacity: 0.85;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .status-icon {
            width: 24px;
            display: inline-block;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .schedule-tag {
            display: none;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 已考完的樣式 */
        .schedule-row.finished {
            background-color: #f8fafc;
            opacity: 0.65;
            box-shadow: none;
        }
        .schedule-row.finished .subject-name {
            color: #94a3b8;
        }
        .schedule-row.finished .status-icon {
            color: #10b981;
            font-size: 1.8rem;
            text-shadow: 0 2px 5px rgba(16,185,129,0.3);
        }

        /* 下課中：下一節即將開始的樣式 */
        .container.break-mode .schedule-row.next-up {
            background: linear-gradient(120deg, #f0f9ff 0%, #e0f2fe 100%);
            border-color: #38bdf8;
            color: #0369a1;
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.25);
            transform: scale(1.01);
            z-index: 5;
        }
        .container.break-mode .schedule-row.next-up .subject-name {
            font-weight: 900;
            color: #0284c7;
            font-size: 1.75rem;
        }
        .container.break-mode .schedule-row.next-up .subject-time {
            color: #0284c7;
            font-weight: 800;
            opacity: 1;
        }
        .container.break-mode .schedule-row.next-up .schedule-tag {
            display: inline-block;
            background: #0284c7;
            color: #fff;
            animation: pulse-tag 1.5s infinite;
        }

        @keyframes pulse-tag {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.04); }
        }

        /* 考試中 (Exam Mode)：課表區焦點卡 + 下方超大考場班級卡 (完美利用左側空間) */
        .exam-class-card {
            display: none;
        }
        .container.exam-mode .schedule-section {
            flex: 0 0 auto;
            justify-content: center;
            align-items: center;
            padding: 16px 18px 8px 18px;
            overflow: hidden;
            min-width: 0;
        }
        .container.exam-mode .schedule-row:not(.active) {
            display: none !important;
        }
        .container.exam-mode .schedule-row.active {
            width: 100%;
            height: auto;
            min-height: 160px;
            max-height: 220px;
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto auto;
            align-items: center;
            background: var(--active-bg);
            color: var(--active-text);
            box-shadow: var(--active-shadow);
            border-radius: 22px;
            padding: 20px 24px;
            border: none;
            transform: none;
            gap: 12px 10px;
            min-width: 0;
            overflow: hidden;
        }
        .container.exam-mode .exam-class-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            border: 2px solid #7dd3fc;
            border-radius: 22px;
            padding: 14px 20px;
            margin: 8px 18px 18px 18px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.08);
            flex: 1;
            min-height: 130px;
            max-height: 190px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .exam-class-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0284c7;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
            padding: 4px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
        }
        .exam-class-name {
            font-size: clamp(2.4rem, 4vw, 3.4rem);
            font-weight: 900;
            color: #0369a1;
            letter-spacing: 3px;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .container.exam-mode .schedule-row.active .schedule-badge-area {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            justify-self: start;
            min-width: 0;
        }
        .container.exam-mode .schedule-row.active .status-icon {
            display: none;
        }
        .container.exam-mode .schedule-row.active .schedule-tag {
            display: inline-block;
            background: #ffffff;
            color: #d97706;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 12px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: nowrap;
        }
        .container.exam-mode .schedule-row.active .subject-time {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            justify-self: end;
            margin-left: 0;
            font-size: 1.45rem;
            font-weight: 800;
            font-family: 'Roboto Mono', monospace;
            background: rgba(255, 255, 255, 0.28);
            padding: 4px 12px;
            border-radius: 12px;
            color: #fff;
            letter-spacing: 0.5px;
            opacity: 1;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .container.exam-mode .schedule-row.active .subject-name {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            font-size: 3.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.15;
            padding-left: 4px;
            padding-top: 6px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.18);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 3. 右側主面板 (Boss + 考勤平行並列專區) --- */
        .right-panel {
            height: 100%;
            background: rgba(255, 255, 255, 0.55);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid rgba(255,255,255,0.8);
            min-width: 0;
        }

        /* Boss Battle Area */
        .boss-battle-area {
            background: white;
            margin: 18px 22px 14px 22px;
            padding: 16px 28px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 22px;
            border: 1px solid rgba(0,0,0,0.03);
            flex-shrink: 0;
        }

        .boss-avatar {
            font-size: 4.2rem;
            min-width: 85px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
            transform-origin: center bottom;
        }
        
        /* === Boss Avatar Animations === */
        @keyframes float-breath {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .anim-float { animation: float-breath 3s ease-in-out infinite; }

        @keyframes nervous-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .anim-shake { animation: nervous-shake 0.5s infinite; }

        @keyframes dying-fall {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(20px) scale(0.9) rotate(20deg); opacity: 0.8; }
            100% { transform: translateY(100px) scale(0.5) rotate(90deg); opacity: 0; }
        }
        .anim-die { animation: dying-fall 2s forwards; }

        .hp-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hp-text {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            gap: 12px;
        }
        .boss-name { white-space: nowrap; }
        .boss-timer { white-space: nowrap; }

        .boss-name { color: var(--text-primary); }
        .boss-timer { font-family: 'Roboto Mono', monospace; color: var(--accent-color); font-weight: 700; }

        .hp-bar-frame {
            height: 34px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: visible;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            background: var(--success-color);
            border-radius: 20px;
            transition: width 1s linear, background-color 0.5s;
            position: relative;
        }

        /* 奔跑的小恐龍 */
        .dino-runner {
            position: absolute;
            right: -25px;
            top: -28px;
            font-size: 2.8rem;
            user-select: none;
            cursor: pointer;
            z-index: 100;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            animation: dino-run 0.6s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }

        @keyframes dino-run {
            0% { transform: translateY(0) rotate(-6deg); }
            100% { transform: translateY(-8px) rotate(6deg); }
        }

        .hp-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-image: linear-gradient(
                -45deg, 
                rgba(255, 255, 255, 0.2) 25%, 
                transparent 25%, 
                transparent 50%, 
                rgba(255, 255, 255, 0.2) 50%, 
                rgba(255, 255, 255, 0.2) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 40px 40px;
            animation: move-stripes 2s linear infinite;
            border-radius: 20px;
        }

        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        /* --- 4. 考勤與缺考專區 (水平平行並列) --- */
        .attendance-section {
            flex: 1;
            margin: 0 22px 18px 22px;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(170px, 200px) 1fr;
            gap: 14px;
            overflow: hidden;
            min-width: 0;
        }

        /* 左邊：應到、實到、缺考 (縱向堆疊三卡) */
        .attendance-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-width: 0;
        }

        .stat-box {
            flex: 1;
            min-height: 64px;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            transition: all 0.3s ease;
            min-width: 0;
        }
        .stat-box:hover {
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        .stat-box.stat-expected {
            border-left: 6px solid #0984e3;
        }
        .stat-box.stat-actual {
            border-left: 6px solid #00b894;
        }
        .stat-box.stat-absent {
            border-left: 6px solid #e17055;
        }
        .stat-box.stat-absent.zero-absent,
        .stat-box.stat-absent:has(.stat-value.zero) {
            border-left: 6px solid #cbd5e1;
        }

        .stat-label {
            font-size: 1.2rem;
            color: #475569;
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1;
            font-family: 'Roboto Mono', monospace;
        }
        .stat-value.expected { color: #0984e3; }
        .stat-value.actual { color: #00b894; }
        .stat-value.absent { color: #e17055; }
        .stat-value.absent.zero { color: #94a3b8; }

        /* 右邊：缺考資訊獨立大看板 */
        .absent-board {
            height: 100%;
            min-height: 0;
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .absent-board-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
            min-width: 0;
        }

        .absent-board-title-group {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .absent-board-icon {
            font-size: 1.35rem;
            flex-shrink: 0;
        }

        .absent-board-title {
            font-size: clamp(1.05rem, 1.4vw, 1.2rem);
            font-weight: 800;
            color: #334155;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .absent-badge {
            font-size: 0.95rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 10px;
            background: #e2e8f0;
            color: #475569;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .absent-badge.warning {
            background: #fee2e2;
            color: #ef4444;
        }
        .absent-badge.success {
            background: #dcfce7;
            color: #16a34a;
        }

        .absent-board-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.18) transparent;
            padding: 4px 2px;
        }

        /* 缺考座號膠囊標籤 (支援空白隔開、自動流式排列) */
        .absent-items-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            align-content: flex-start;
        }

        .absent-pill {
            background: linear-gradient(135deg, #fff1f2 0%, #fee2e2 100%);
            border: 2px solid #f87171;
            color: #991b1b;
            font-size: 2rem;
            font-weight: 900;
            padding: 5px 18px;
            border-radius: 14px;
            box-shadow: 0 3px 8px rgba(239, 68, 68, 0.12);
            font-family: 'Roboto Mono', 'Noto Sans TC', monospace;
            display: inline-flex;
            align-items: center;
            letter-spacing: 1px;
        }

        .all-present-msg {
            color: #059669;
            font-size: 1.55rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 8px;
            text-align: center;
            line-height: 1.35;
        }

        /* --- 5. 視窗最下面區塊：考場大字提醒 / 跑馬燈 --- */
        .bottom-reminder-bar {
            flex: 0 0 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.85);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 0 70px;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.02);
            transition: all 0.4s ease;
        }

        #main-reminder {
            font-size: clamp(1.6rem, 2.4vw, 2.2rem);
            font-weight: 900;
            color: var(--text-primary);
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
            line-height: 1.25;
            text-align: center;
            white-space: pre-line;
        }

        .bottom-reminder-bar.marquee-active #main-reminder {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            animation: bottom-reminder-scroll 22s linear infinite;
            padding-left: 100%;
            white-space: nowrap;
        }

        @keyframes bottom-reminder-scroll {
            from { transform: translate(0, -50%); }
            to { transform: translate(-100%, -50%); left: 0; }
        }

        /* 最後 5 分鐘緊急警戒條 */
        @keyframes urgent-bar-pulse {
            0%, 100% {
                background: rgba(254, 226, 226, 0.9);
                border-top-color: #f87171;
            }
            50% {
                background: rgba(254, 202, 202, 0.98);

        let currentBossKey = 'monster';

        // --- 輕量彩帶 (Confetti) 粒子引擎 ---
        let confettiActive = false;
        let confettiParticles = [];
        const confettiColors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#fdcb6e'];

        function triggerConfetti(durationMs = 7000) {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';

            confettiParticles = [];
            for (let i = 0; i < 160; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * -canvas.height * 0.8,
                    w: Math.random() * 14 + 6,
                    h: Math.random() * 8 + 4,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    vy: Math.random() * 4 + 2.5,
                    vx: Math.random() * 4 - 2,
                    angle: Math.random() * 360,
                    angSpeed: (Math.random() - 0.5) * 10
                });
            }

            confettiActive = true;
            const startTime = Date.now();

            function renderConfetti() {
                if (!confettiActive) return;
                const elapsed = Date.now() - startTime;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                confettiParticles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx + Math.sin(p.y * 0.02) * 1.5;
                    p.angle += p.angSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();

                    if (p.y > canvas.height) {
                        p.y = -15;
                        p.x = Math.random() * canvas.width;
                    }
                });

                if (elapsed < durationMs) {
                    requestAnimationFrame(renderConfetti);
                } else {
                    confettiActive = false;
                    canvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(renderConfetti);
        }

        // --- 實務功能：考勤人數智慧自動連動計算與顯示更新 ---
        function getAbsentItems(text) {
            if (!text) return [];
            const trimmed = text.trim();
            if (!trimmed || trimmed === '無' || trimmed === '缺考座號:原因' || trimmed === '全勤' || trimmed === '全到') {
                return [];
            }
            // 依空白、換行、逗號、分號、頓號分割各項紀錄 (空白隔開即可，無需按 Enter)
            const rawItems = trimmed.split(/[\s,;，；、]+/).map(s => s.trim()).filter(s => s.length > 0);
            return rawItems.filter(item => {
                return item !== '無' && item !== '缺考座號:原因' && item !== '全勤' && item !== '全到';
            });
        }

        function parseAbsentCount(text) {
            return getAbsentItems(text).length;

        function updateScheduleAndBoss(nowDate) {
            const currentTotalMin = nowDate.getHours() * 60 + nowDate.getMinutes();
            const container = document.querySelector('.container');
            
            let isExamining = false;
            let activeSubject = null;
            let activeIndex = -1;
            let nextIndex = -1;

            currentSchedule.forEach((item, index) => {
                const [sH, sM] = item.start.split(':').map(Number);
                const [eH, eM] = item.end.split(':').map(Number);
                const startMin = sH * 60 + sM;
                const endMin = eH * 60 + eM;

                if (currentTotalMin >= startMin && currentTotalMin < endMin) {
                    isExamining = true;
                    activeSubject = item;
                    activeIndex = index;
                } else if (startMin > currentTotalMin && nextIndex === -1) {
                    nextIndex = index;
                }
            });

            // 動態切換容器樣式：考試焦點模式 vs 下課全日清單模式
            if (container) {
                if (isExamining) {
                    container.classList.add('exam-mode');
                    container.classList.remove('break-mode');
                    updateSchoolLabel(true);
                } else {
                    container.classList.add('break-mode');
                    container.classList.remove('exam-mode');
                    updateSchoolLabel(false);
                }
            }

            // 更新課表各列
            currentSchedule.forEach((item, index) => {
                const row = document.getElementById(`schedule-${index}`);
                if (!row) return;

                const iconSpan = row.querySelector('.status-icon');
                const tagSpan = document.getElementById(`schedule-tag-${index}`);

                row.classList.remove('active', 'finished', 'next-up');
                if (iconSpan) iconSpan.innerText = '';
                if (tagSpan) {
                    tagSpan.innerText = '';
                    tagSpan.style.display = 'none';
                }

                const [sH, sM] = item.start.split(':').map(Number);
                const [eH, eM] = item.end.split(':').map(Number);
                const startMin = sH * 60 + sM;
                const endMin = eH * 60 + eM;

                if (index === activeIndex) {
                    // 當節考試中
                    row.classList.add('active');
                    if (iconSpan) iconSpan.innerText = '⚡';
                    if (tagSpan) {
                        tagSpan.innerText = '📝 當節考試';
                        tagSpan.style.display = 'inline-block';
                    }

                    // Boss 血條計算
                    const startTime = new Date(nowDate); startTime.setHours(sH, sM, 0);
                    const endTime = new Date(nowDate); endTime.setHours(eH, eM, 0);
                    
                    const totalDuration = (endTime - startTime) / 1000;
                    const elapsed = (nowDate - startTime) / 1000;
                    const remaining = totalDuration - elapsed;

                    let percentage = ((remaining / totalDuration) * 100).toFixed(1);
                    if (percentage < 0) percentage = 0;

                    // 最後 5 分鐘警示處理
                    const alert5MinEnabled = localStorage.getItem('exam_board_alert_5min') !== 'false';
                    const bossBattleArea = document.querySelector('.boss-battle-area');
                    const reminderContainer = document.getElementById('reminder-container');
                    const mainReminder = document.getElementById('main-reminder');
                    const marqueeEnabled = localStorage.getItem('exam_board_marquee') === 'true';

                    if (alert5MinEnabled && remaining <= 300 && remaining > 0) {
                        if (bossBattleArea) bossBattleArea.classList.add('urgent-mode');
                        if (!marqueeEnabled && mainReminder && !mainReminder.innerText.includes('最後 5 分鐘')) {
                            mainReminder.innerText = "⚠️ 距離考試結束僅剩最後 5 分鐘！\n請再次檢查考卷跟姓名";
                        }
                    } else {
                        if (bossBattleArea) bossBattleArea.classList.remove('urgent-mode');
                        if (!marqueeEnabled && mainReminder && mainReminder.innerText.includes('最後 5 分鐘')) {
                            const savedReminder = localStorage.getItem('exam_board_reminder') || "準備考試\n請保持安靜";
                            mainReminder.innerText = savedReminder;
                        }
                    }

                    updateBossUI(item.subject, percentage, remaining);
                } else if (currentTotalMin >= endMin) {
                    // 已考完
                    row.classList.add('finished');
                    if (iconSpan) iconSpan.innerText = '✔';
                } else if (!isExamining && index === nextIndex) {
                    // 下課中：標註下一節即將開始
                    row.classList.add('next-up');
                    if (iconSpan) iconSpan.innerText = '👉';
                    if (tagSpan) {
                        tagSpan.innerText = '⏰ 下節預備';
                        tagSpan.style.display = 'inline-block';
                    }
                }
            });

            // 檢查是否剛好從考試中轉變為考完（觸發勝利通關慶祝）
            if (lastExamState.wasExamining && !isExamining) {

            lastExamState.wasExamining = isExamining;
            if (isExamining && activeSubject) {

            currentClassName = className;
            if (customInput) customInput.value = className;

            // 1. 自動填入應到人數
            const expectedInput = document.getElementById('input-expected');
            if (expectedInput && count) {
                expectedInput.value = count;
            }

            // 2. 自動切換對應年級考程
            const gradeSelect = document.getElementById('select-grade');
            if (gradeSelect && grade) {
                gradeSelect.value = grade;
                const selectedDay = document.getElementById('select-day').value;
                currentSchedule = allSchedules[grade][selectedDay];
                renderSchedule();
            }

            // 3. 更新考場標籤與大班級卡
            updateSchoolLabel(isExam);

            // 4. 即時連動更新實到人數與版面
            autoCalculateAttendance();

            // 5. 提示標籤
            if (hint) {
                hint.innerHTML = `✅ 已自動帶入<b>【${className}】</b>全班人數 <b>${count}</b> 人（男生 ${boy}、女生 ${girl}）`;
            }
        }

        function openSettings() { document.getElementById('settings-panel').style.display = 'block'; }
        function closeSettings() { document.getElementById('settings-panel').style.display = 'none'; }

        function saveSettings() {
            const reminderText = document.getElementById('input-reminder').value;
            const marqueeEnabled = document.getElementById('input-reminder-marquee').checked;
            
            const expected = document.getElementById('input-expected').value;
            const actual = document.getElementById('input-actual').value;
            const absentList = document.getElementById('input-absent-list').value;

            const reminderContainer = document.getElementById('reminder-container');
            const mainReminder = document.getElementById('main-reminder');

            if (marqueeEnabled) {
                reminderContainer.classList.add('marquee-active');
                mainReminder.innerText = reminderText.replace(/\n/g, '   ');
            } else {
                reminderContainer.classList.remove('marquee-active');
                mainReminder.innerText = reminderText; 
            }

            document.getElementById('display-expected').innerText = expected;
            document.getElementById('display-actual').innerText = actual;
            document.getElementById('display-absent-list').innerText = absentList;

            const selectedGrade = document.getElementById('select-grade').value;
            const selectedDay = document.getElementById('select-day').value;
            currentSchedule = allSchedules[selectedGrade][selectedDay];
            renderSchedule();

            const selectedBoss = document.getElementById('select-boss').value;
            const selectedRunner = document.getElementById('select-runner').value;
            currentBossKey = selectedBoss;
            currentRunnerKey = selectedRunner;
            localStorage.setItem('exam_board_boss', selectedBoss);
            localStorage.setItem('exam_board_runner', selectedRunner);
            
            const dinoIcon = document.getElementById('dino-icon');
            if (dinoIcon) {
                dinoIcon.innerText = runnerCharacters[currentRunnerKey] || "🦖";
            }

            const alert5Min = document.getElementById('input-alert-5min').checked;
            localStorage.setItem('exam_board_alert_5min', alert5Min);

            const selectedClass = document.getElementById('select-class').value;
            localStorage.setItem('exam_board_class', selectedClass);
            const customClassVal = document.getElementById('input-custom-class') ? document.getElementById('input-custom-class').value.trim() : '';
            localStorage.setItem('exam_board_custom_class', customClassVal);
            localStorage.setItem('exam_board_grade', selectedGrade);
            localStorage.setItem('exam_board_day', selectedDay);
            localStorage.setItem('exam_board_reminder', reminderText);
            localStorage.setItem('exam_board_marquee', marqueeEnabled);
            localStorage.setItem('exam_board_expected', expected);
            localStorage.setItem('exam_board_actual', actual);
            localStorage.setItem('exam_board_absent_list', absentList);

            autoCalculateAttendance();
            updateTime();

            closeSettings();
        }

        function loadSavedSettings() {
            const savedClass = localStorage.getItem('exam_board_class') || '602';
            const savedCustomClass = localStorage.getItem('exam_board_custom_class') || '';
            const classSelect = document.getElementById('select-class');
            const customGroup = document.getElementById('custom-class-group');
            const customInput = document.getElementById('input-custom-class');

            if (customInput) {
                customInput.value = savedCustomClass;
            }

            if (classSelect) {
                classSelect.value = savedClass;
                if (savedClass !== 'custom') {
                    if (customGroup) customGroup.style.display = 'none';
                    const selectedOption = classSelect.options[classSelect.selectedIndex];
                    if (selectedOption) {
                        const className = selectedOption.text.split(' ')[0];
                        currentClassName = className;
                        const count = selectedOption.getAttribute('data-count');
                        const boy = selectedOption.getAttribute('data-boy');
                        const girl = selectedOption.getAttribute('data-girl');
                        const hint = document.getElementById('class-select-hint');
                        if (hint && count) {
                            hint.innerHTML = `✅ 目前班級：<b>【${className}】</b>全班 <b>${count}</b> 人（男生 ${boy}、女生 ${girl}）`;
                        }
                    }
                } else {
                    if (customGroup) customGroup.style.display = 'block';
                    currentClassName = savedCustomClass || '考場';
                }
            }

            const isExam = document.querySelector('.container')?.classList.contains('exam-mode');
            updateSchoolLabel(isExam);

            const savedGrade = localStorage.getItem('exam_board_grade') || 'high';
            const savedDay = localStorage.getItem('exam_board_day') || 'day1';
            
            document.getElementById('select-grade').value = savedGrade;
            document.getElementById('select-day').value = savedDay;
            currentSchedule = allSchedules[savedGrade][savedDay];

            currentBossKey = localStorage.getItem('exam_board_boss') || 'monster';
            currentRunnerKey = localStorage.getItem('exam_board_runner') || 'dino';
            document.getElementById('select-boss').value = currentBossKey;
            document.getElementById('select-runner').value = currentRunnerKey;
            const dinoIcon = document.getElementById('dino-icon');
            if (dinoIcon) {
                dinoIcon.innerText = runnerCharacters[currentRunnerKey] || "🦖";
            }

            const alert5Min = localStorage.getItem('exam_board_alert_5min') !== 'false';
            document.getElementById('input-alert-5min').checked = alert5Min;
            
            const items = ['reminder', 'expected', 'actual', 'absent_list'];
            const defaults = {
                reminder: "準備考試\n請保持安靜",
                expected: "30",
                actual: "28",
                absent_list: "缺考座號:原因"
            };
            const ids = {
                reminder: ['input-reminder', 'main-reminder'],
                expected: ['input-expected', 'display-expected'],
                actual: ['input-actual', 'display-actual'],
                absent_list: ['input-absent-list', 'display-absent-list']
            };

            items.forEach(key => {
                const savedVal = localStorage.getItem(`exam_board_${key}`);
                const val = savedVal !== null ? savedVal : defaults[key];
                document.getElementById(ids[key][0]).value = val;
                document.getElementById(ids[key][1]).innerText = val;
            });

            autoCalculateAttendance();

            const marqueeEnabled = localStorage.getItem('exam_board_marquee') === 'true';
            document.getElementById('input-reminder-marquee').checked = marqueeEnabled;
            
            const reminderText = document.getElementById('input-reminder').value;
            const reminderContainer = document.getElementById('reminder-container');
            const mainReminder = document.getElementById('main-reminder');
            
            if (marqueeEnabled) {
                reminderContainer.classList.add('marquee-active');
                mainReminder.innerText = reminderText.replace(/\n/g, '   ');
            } else {
                reminderContainer.classList.remove('marquee-active');
                mainReminder.innerText = reminderText;
            }
        }

        window.onload = function() {
            loadSavedSettings(); 
            renderSchedule(); 
            const urlParams = new URLSearchParams(window.location.search);
            const simParam = urlParams.get('sim');
            if (simParam === 'exam' || simParam === 'break') {
                setSimulation(simParam);
            }
            setInterval(updateTime, 1000);
            updateTime();
        };

    </script>

    <!-- 慶祝彩帶畫布 -->
    <canvas id="confetti-canvas"></canvas>
</body>
</html>
